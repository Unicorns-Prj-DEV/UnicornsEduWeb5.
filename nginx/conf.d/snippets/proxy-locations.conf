# Shared reverse-proxy routes (HTTP + HTTPS server blocks).
# Included from nginx/conf.d/app.conf and optional https vhost.

    # ── Socket.io WebSocket ──────────────────────────────────────────────────
    location /socket.io/ {
        set $upstream_api api;
        proxy_pass         http://$upstream_api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $proxy_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API (strip /api prefix) ──────────────────────────────────────────────
    location = /api {
        return 302 /api/;
    }

    location /api/ {
        set $upstream_api api;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass         http://$upstream_api:4000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $proxy_x_forwarded_proto;
    }

    # ── Supabase Storage self-host (strip /storage/v1 prefix) ────────────────
    # `storage` là alias của storage-api instance trên network ${DATA_NETWORK}
    # (deploy/data-stack). Resolve lazy nên nginx vẫn lên khi storage chưa chạy.
    # Cắt prefix từ $request_uri (giữ nguyên path đã encode + query token của
    # signed URL) thay vì rewrite trên $uri đã decode.
    location /storage/v1/ {
        set $upstream_storage storage;
        set $storage_uri /;
        if ($request_uri ~ ^/storage/v1(/.*)$) {
            set $storage_uri $1;
        }
        proxy_pass         http://$upstream_storage:5000$storage_uri;
        proxy_http_version 1.1;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $proxy_x_forwarded_proto;
    }

    # ── Next.js frontend ─────────────────────────────────────────────────────
    location / {
        set $upstream_web web;
        proxy_pass         http://$upstream_web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $proxy_x_forwarded_proto;
    }
